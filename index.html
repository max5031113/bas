function setupAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const area = document.getElementById(suggestionsId);

  input.addEventListener("input", () => {
    const keyword = input.value.trim();
    area.innerHTML = "";

    if (!keyword) {
      area.style.display = "none";
      return;
    }

    const matches = busStops.filter(stop =>
      stop.includes(keyword)
    ).slice(0, 10);

    if (!matches.length) {
      area.style.display = "none";
      return;
    }

    matches.forEach(stop => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = stop;
      button.addEventListener("click", () => {
        input.value = stop;
        area.style.display = "none";
      });
      area.appendChild(button);
    });

    area.style.display = "block";
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Escape") area.style.display = "none";
  });
}

setupAutocomplete("from", "fromSuggestions");
setupAutocomplete("to", "toSuggestions");

document.addEventListener("click", event => {
  document.querySelectorAll(".autocomplete-wrap").forEach(wrap => {
    if (!wrap.contains(event.target)) {
      wrap.querySelector(".suggestions").style.display = "none";

});

function parseTimetable(raw) {
  return raw.trim().split("\n").map(line => {
    const [
      departure, arrival, via, platform,
      fare, duration, route, yearStop
    ] = line.trim().split(",");

    return {
      departure,
      arrival,
      via,
      platform,
      fare: Number(fare),
      duration: Number(duration),
      route,
      yearStop: yearStop === "1"
    };
  });
}

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

const today = new Date();

dateInput.value = localDateString(today);

function updateServiceType() {
  if (!dateInput.value) return;

  const date = new Date(dateInput.value + "T12:00:00");
  const day = date.getDay();

  document.getElementById("serviceType").value =
    (day === 0 || day === 6) ? "holiday" : "weekday";
}

dateInput.addEventListener("change", () => {
  updateServiceType();
});

updateServiceType();

// ===================================
// 時刻変換・HTMLエスケープ
// ===================================

function timeToMinutes(time) {
  const [h, m] = time.split(":").map(Number);
  return h * 60 + m;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// ===================================
// 公式時刻表へのリンク
// ===================================

function officialTimetableURL(stopName) {
  return "https://busget.fukushima-koutu.co.jp/fromto/find/?f_from="
    + encodeURIComponent(stopName);
}

function showOfficialSearch(fromValue, toValue) {
  const area = document.getElementById("tripList");
  const safeFrom = escapeHTML(fromValue);
  const safeTo = escapeHTML(toValue);
  const url = officialTimetableURL(fromValue);

  area.innerHTML = `
    <div class="no-result">
      <strong>この区間はアプリ内に時刻表がありません。</strong>
      <br><br>

      出発地：${safeFrom}<br>
      到着地：${safeTo}<br><br>

      公式サイトで出発地を選択したあと、
      到着地「${safeTo}」を選択してください。

      <a class="official-button"
         href="${url}"
         target="_blank"
         rel="noopener">
        この区間の公式時刻表を確認 ↗
      </a>

      <p class="small-note">
        福島交通公式サイトで発着時刻・運賃を確認できます。
        到着地は公式サイト側で選択してください。
      </p>
    </div>
  `;
}

// ===================================
// バス検索
// ===================================

function searchRoute() {
  const fromValue = document.getElementById("from").value.trim();
  const toValue = document.getElementById("to").value.trim();
  const dateValue = dateInput.value;
  const timeValue = document.getElementById("time").value;
  const serviceType = document.getElementById("serviceType").value;

  const resultArea = document.getElementById("tripList");
  const condition = document.getElementById("condition");
  const detailArea = document.getElementById("detailArea");

  currentResults = [];
  detailArea.innerHTML = "";

  if (!fromValue || !toValue) {
    resultArea.innerHTML = `
      <div class="no-result">出発地と到着地を入力してください。</div>
    `;
    return;
  }

  if (fromValue === toValue) {
    resultArea.innerHTML = `
      <div class="no-result">出発地と到着地が同じです。別の停留所を選んでください。</div>
    `;
    return;
  }

  if (!dateValue || !timeValue) {
    resultArea.innerHTML = `
      <div class="no-result">乗車日と時刻を入力してください。</div>
    `;
    return;
  }

  condition.textContent =
    `${fromValue} → ${toValue} ／ ${dateValue} ／ ${
      serviceType === "weekday" ? "平日ダイヤ" : "土日祝ダイヤ"
    } ／ ${timeValue}以降`;

  // 現在アプリ内に登録されている区間
  if (fromValue !== "御前" || toValue !== "郡山駅前") {
    showOfficialSearch(fromValue, toValue);
    return;
  }

  const selectedDate = new Date(dateValue + "T12:00:00");
  const month = selectedDate.getMonth() + 1;
  const day = selectedDate.getDate();

  const isYearEnd =
    (month === 12 && day >= 31) ||
    (month === 1 && day <= 3);

  let timetable =
    serviceType === "weekday" ? weekdayData : holidayData;

  if (isYearEnd) {
    timetable = timetable.filter(bus => !bus.yearStop);
  }

  const searchMinutes = timeToMinutes(timeValue);

  const results = timetable.filter(bus =>
    timeToMinutes(bus.departure) >= searchMinutes
  );

  currentResults = results;

  if (!results.length) {
    resultArea.innerHTML = `
      <div class="no-result">
        該当するバスが見つかりませんでした。<br>
        時刻を早めて、もう一度検索してみてください。
      </div>
    `;
    return;
  }

  resultArea.innerHTML = `
    <p class="small-note">
      ※この区間のアプリ内登録データです。最新の公式時刻との照合が必要です。
    </p>
  ` + results.map((bus, index) => `
    <div class="trip" onclick="showBusDetail(${index})" style="cursor:pointer">
      <div class="trip-top">
        <div class="time">${escapeHTML(bus.departure)}</div>
        <div class="arrival">
          到着予定<br>
          <strong style="font-size:20px;color:#222">
            ${escapeHTML(bus.arrival)}
          </strong>
        </div>
      </div>

      <div class="trip-line">
        <span>${escapeHTML(fromValue)}</span>
        <div class="line"></div>
        <span>${escapeHTML(toValue)}</span>
      </div>

      <div class="tags">
        <span class="tag blue">${escapeHTML(bus.platform)}のりば</span>
        <span class="tag">${escapeHTML(bus.via)}経由</span>
        <span class="tag">${bus.duration}分</span>
        <span class="tag green">${bus.fare}円</span>
        <span class="tag">系統 ${escapeHTML(bus.route)}</span>
      </div>

      <div style="text-align:right;color:#3478f6;font-size:12px;margin-top:12px">
        詳細を見る →
      </div>
    </div>
  `).join("");
}

// ===================================
// バス詳細
// ===================================

function showBusDetail(index) {
  const bus = currentResults[index];
  if (!bus) return;

  const fromValue = document.getElementById("from").value.trim();
  const toValue = document.getElementById("to").value.trim();
  const detailArea = document.getElementById("detailArea");

  detailArea.innerHTML = `
    <div class="detail-panel" id="busDetail">
      <h2>バスの詳細</h2>

      <div class="detail-row">
        <span class="detail-label">出発地</span>
        <span class="detail-value">${escapeHTML(fromValue)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">出発時刻</span>
        <span class="detail-value">${escapeHTML(bus.departure)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">到着地</span>
        <span class="detail-value">${escapeHTML(toValue)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">到着時刻</span>
        <span class="detail-value">${escapeHTML(bus.arrival)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">経由</span>
        <span class="detail-value">${escapeHTML(bus.via)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">のりば</span>
        <span class="detail-value">${escapeHTML(bus.platform)}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">運賃</span>
        <span class="detail-value">${bus.fare}円</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">所要時間</span>
        <span class="detail-value">約${bus.duration}分</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">系統</span>
        <span class="detail-value">${escapeHTML(bus.route)}</span>
      </div>
    </div>
  `;

  detailArea.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

// ===================================
// 初期検索
// ===================================

searchRoute();
</script>
</body>
</html>
